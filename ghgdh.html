<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مغامرة البطل</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%;
    background:#07080f;
    display:flex; align-items:center; justify-content:center;
    font-family:'Segoe UI', Tahoma, sans-serif;
    overflow:hidden;
  }
  canvas {
    display:block;
    border-radius:14px;
    box-shadow:0 0 80px rgba(70,120,255,.35), 0 0 20px rgba(70,120,255,.2);
    max-width:98vw;
    max-height:96vh;
    image-rendering:auto;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
(() => {
"use strict";

/* ============================================================
   الإعدادات الأساسية
   ============================================================ */
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const W = 900, H = 600;
cvs.width = W;
cvs.height = H;

/* ============================================================
   المؤثرات الصوتية البسيطة
   ============================================================ */
let audioCtx = null;
function beep(freq, dur, type = 'sine', vol = 0.05) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) { /* تجاهل */ }
}

/* ============================================================
   بيانات المراحل
   ============================================================ */
const LEVELS = [
  {
    name: 'الغابة المظلمة',
    start: { x: 70, y: 300 },
    goal:  { x: 820, y: 300 },
    walls: [
      { x:0,   y:0,   w:900, h:20  },
      { x:0,   y:580, w:900, h:20  },
      { x:0,   y:0,   w:20,  h:600 },
      { x:880, y:0,   w:20,  h:600 },
      { x:200, y:80,  w:30,  h:180 },
      { x:200, y:340, w:30,  h:180 },
      { x:400, y:160, w:30,  h:280 },
      { x:600, y:80,  w:30,  h:180 },
      { x:600, y:340, w:30,  h:180 }
    ],
    coins: [
      { x:150, y:150 }, { x:150, y:450 }, { x:320, y:300 },
      { x:500, y:80  }, { x:500, y:520 }, { x:700, y:150 },
      { x:700, y:450 }
    ],
    enemies: [
      { x:300, y:120, speed:85,  patrol:[{x:300,y:120},{x:300,y:520}] },
      { x:750, y:500, speed:95,  patrol:[{x:750,y:500},{x:750,y:100}] }
    ]
  },
  {
    name: 'الكهف الجليدي',
    start: { x: 70, y: 70 },
    goal:  { x: 820, y: 300 },
    walls: [
      { x:0,   y:0,   w:900, h:20  },
      { x:0,   y:580, w:900, h:20  },
      { x:0,   y:0,   w:20,  h:600 },
      { x:880, y:0,   w:20,  h:600 },
      { x:120, y:120, w:200, h:30  },
      { x:120, y:120, w:30,  h:200 },
      { x:600, y:120, w:30,  h:200 },
      { x:700, y:120, w:200, h:30  },
      { x:400, y:250, w:30,  h:120 },
      { x:200, y:420, w:200, h:30  },
      { x:500, y:450, w:250, h:30  },
      { x:700, y:450, w:30,  h:130 }
    ],
    coins: [
      { x:70,  y:300 }, { x:300, y:70  }, { x:300, y:250 },
      { x:500, y:150 }, { x:520, y:350 }, { x:750, y:300 },
      { x:850, y:550 }, { x:250, y:520 }
    ],
    enemies: [
      { x:100, y:500, speed:95,  patrol:[{x:100,y:500},{x:100,y:100}] },
      { x:520, y:100, speed:100, patrol:[{x:520,y:100},{x:520,y:400}] },
      { x:800, y:200, speed:90,  patrol:[{x:800,y:200},{x:800,y:520}] }
    ]
  },
  {
    name: 'القلعة النارية',
    start: { x: 70, y: 300 },
    goal:  { x: 820, y: 520 },
    walls: [
      { x:0,   y:0,   w:900, h:20  },
      { x:0,   y:580, w:900, h:20  },
      { x:0,   y:0,   w:20,  h:600 },
      { x:880, y:0,   w:20,  h:600 },
      { x:250, y:100, w:30,  h:250 },
      { x:250, y:450, w:30,  h:130 },
      { x:450, y:250, w:200, h:30  },
      { x:650, y:100, w:30,  h:180 },
      { x:100, y:380, w:150, h:30  },
      { x:700, y:350, w:180, h:30  }
    ],
    coins: [
      { x:150, y:200 }, { x:350, y:180 }, { x:550, y:150 },
      { x:600, y:400 }, { x:800, y:200 }, { x:400, y:500 },
      { x:150, y:500 }, { x:820, y:480 }
    ],
    enemies: [
      { x:150, y:100, speed:105, patrol:[{x:150,y:100},{x:150,y:350}] },
      { x:400, y:100, speed:110, patrol:[{x:400,y:100},{x:400,y:400}] },
      { x:600, y:350, speed:100, patrol:[{x:600,y:350},{x:600,y:550}] },
      { x:820, y:100, speed:115, patrol:[{x:820,y:100},{x:820,y:300}] }
    ]
  }
];

/* ============================================================
   حالة اللعبة
   ============================================================ */
const player = {
  x: 0, y: 0, r: 14,
  speed: 235,
  facing: 0
};

const game = {
  mode: 'start',        // start | playing | levelComplete | gameOver | win
  levelIndex: 0,
  health: 3,
  maxHealth: 3,
  invuln: 0,
  time: 0,
  transition: 0,
  message: '',
  messageTimer: 0,
  walls: [],
  coins: [],
  enemies: [],
  particles: [],
  goal: { x: 0, y: 0 },
  totalCoins: 0,
  collected: 0,
  shake: 0
};

const keys = Object.create(null);

/* ============================================================
   إدخال لوحة المفاتيح
   ============================================================ */
const BLOCKED = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'];

window.addEventListener('keydown', (e) => {
  if (BLOCKED.includes(e.code)) e.preventDefault();
  keys[e.code] = true;

  if (e.repeat) return;

  if (e.code === 'Space' || e.code === 'Enter') {
    handleAction();
  }
  if (e.code === 'KeyR' && (game.mode === 'playing' || game.mode === 'gameOver')) {
    game.health = game.maxHealth;
    loadLevel(game.levelIndex);
  }
});

window.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});

window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
});

function handleAction() {
  if (game.mode === 'start') {
    game.health = game.maxHealth;
    loadLevel(0);
    beep(520, 0.12, 'triangle', 0.06);
  } else if (game.mode === 'gameOver') {
    game.health = game.maxHealth;
    loadLevel(game.levelIndex);
    beep(520, 0.12, 'triangle', 0.06);
  } else if (game.mode === 'win') {
    game.health = game.maxHealth;
    loadLevel(0);
    beep(520, 0.12, 'triangle', 0.06);
  } else if (game.mode === 'levelComplete') {
    game.transition = 0;
  }
}

/* ============================================================
   تحميل المرحلة
   ============================================================ */
function loadLevel(index) {
  const L = LEVELS[index];
  game.levelIndex = index;
  game.walls = L.walls.map(w => ({ ...w }));
  game.coins = L.coins.map(c => ({
    x: c.x, y: c.y, r: 10, taken: false, phase: Math.random() * Math.PI * 2
  }));
  game.enemies = L.enemies.map(e => ({
    x: e.x, y: e.y, r: 13,
    speed: e.speed || 90,
    patrol: e.patrol.map(p => ({ ...p })),
    wpIndex: 1 % e.patrol.length,
    chasing: false,
    alert: 195,
    phase: Math.random() * Math.PI * 2
  }));
  game.goal = { ...L.goal };
  game.totalCoins = game.coins.length;
  game.collected = 0;
  game.particles = [];
  game.invuln = 0;
  game.shake = 0;
  game.mode = 'playing';
  game.transition = 0;
  player.x = L.start.x;
  player.y = L.start.y;
  player.facing = 0;

  showMessage(L.name, 1.8);
}

function showMessage(text, duration) {
  game.message = text;
  game.messageTimer = duration;
}

/* ============================================================
   أدوات مساعدة
   ============================================================ */
function circleHitsRect(cx, cy, cr, rx, ry, rw, rh) {
  const nx = Math.max(rx, Math.min(cx, rx + rw));
  const ny = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < cr * cr;
}

function hitsWall(x, y, r) {
  for (let i = 0; i < game.walls.length; i++) {
    const w = game.walls[i];
    if (circleHitsRect(x, y, r, w.x, w.y, w.w, w.h)) return true;
  }
  return false;
}

function spawnParticles(x, y, color, count, speedMin = 40, speedMax = 150) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = speedMin + Math.random() * (speedMax - speedMin);
    const life = 0.45 + Math.random() * 0.35;
    game.particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life, max: life,
      size: 2 + Math.random() * 3,
      color
    });
  }
}

/* ============================================================
   التحديث
   ============================================================ */
function update(dt) {
  game.time += dt;

  if (game.messageTimer > 0) game.messageTimer -= dt;
  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 3);
  if (game.invuln > 0) game.invuln -= dt;

  // تحديث الجسيمات في كل الأوضاع
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.94;
    p.vy *= 0.94;
    p.life -= dt;
    if (p.life <= 0) game.particles.splice(i, 1);
  }

  if (game.mode === 'levelComplete') {
    game.transition -= dt;
    if (game.transition <= 0) nextLevel();
    return;
  }

  if (game.mode !== 'playing') return;

  updatePlayer(dt);
  updateEnemies(dt);
  updateCoins();
  checkGoal();
}

function updatePlayer(dt) {
  let ix = 0, iy = 0;
  if (keys['ArrowLeft']  || keys['KeyA']) ix -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) ix += 1;
  if (keys['ArrowUp']    || keys['KeyW']) iy -= 1;
  if (keys['ArrowDown']  || keys['KeyS']) iy += 1;

  const len = Math.hypot(ix, iy);
  if (len > 0) {
    ix /= len;
    iy /= len;
    player.facing = Math.atan2(iy, ix);
  }

  const step = player.speed * dt;

  const nx = player.x + ix * step;
  if (!hitsWall(nx, player.y, player.r)) player.x = nx;

  const ny = player.y + iy * step;
  if (!hitsWall(player.x, ny, player.r)) player.y = ny;

  // التأكد من البقاء داخل الإطار
  player.x = Math.max(player.r, Math.min(W - player.r, player.x));
  player.y = Math.max(player.r, Math.min(H - player.r, player.y));
}

function updateEnemies(dt) {
  for (const e of game.enemies) {
    e.phase += dt * 3;

    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);

    let tx, ty;
    let speed = e.speed;

    if (dist < e.alert) {
      e.chasing = true;
      tx = player.x;
      ty = player.y;
      speed = e.speed * 1.55;
    } else {
      e.chasing = false;
      const wp = e.patrol[e.wpIndex];
      tx = wp.x;
      ty = wp.y;
      if (Math.hypot(wp.x - e.x, wp.y - e.y) < 10) {
        e.wpIndex = (e.wpIndex + 1) % e.patrol.length;
      }
    }

    const ddx = tx - e.x;
    const ddy = ty - e.y;
    const d = Math.hypot(ddx, ddy) || 1;

    const move = speed * dt;
    const nx = e.x + (ddx / d) * move;
    const ny = e.y + (ddy / d) * move;

    if (!hitsWall(nx, e.y, e.r)) e.x = nx;
    if (!hitsWall(e.x, ny, e.r)) e.y = ny;

    // اصطدام باللاعب
    if (dist < e.r + player.r && game.invuln <= 0) {
      damagePlayer(e);
    }
  }
}

function damagePlayer(enemy) {
  game.health--;
  game.invuln = 1.6;
  game.shake = 1;
  spawnParticles(player.x, player.y, '#ff4d6d', 16, 60, 220);
  beep(150, 0.25, 'sawtooth', 0.08);

  // ارتداد بعيداً عن العدو
  const ang = Math.atan2(player.y - enemy.y, player.x - enemy.x);
  const kx = player.x + Math.cos(ang) * 34;
  const ky = player.y + Math.sin(ang) * 34;
  if (!hitsWall(kx, player.y, player.r)) player.x = kx;
  if (!hitsWall(player.x, ky, player.r)) player.y = ky;

  if (game.health <= 0) {
    game.health = 0;
    game.mode = 'gameOver';
    spawnParticles(player.x, player.y, '#ff4d6d', 40, 60, 300);
    beep(120, 0.5, 'sawtooth', 0.09);
  }
}

function updateCoins() {
  for (const c of game.coins) {
    if (c.taken) continue;
    c.phase += 0.05;
    const dx = player.x - c.x;
    const dy = player.y - c.y;
    if (dx * dx + dy * dy < (player.r + c.r + 4) ** 2) {
      c.taken = true;
      game.collected++;
      spawnParticles(c.x, c.y, '#ffd24a', 12, 50, 180);
      beep(880 + game.collected * 40, 0.1, 'triangle', 0.05);

      if (game.collected >= game.totalCoins) {
        showMessage('البوابة فُتحت! توجه إليها', 1.6);
        beep(1200, 0.18, 'sine', 0.06);
      }
    }
  }
}

function checkGoal() {
  if (game.collected < game.totalCoins) return;

  const dx = player.x - game.goal.x;
  const dy = player.y - game.goal.y;
  if (Math.hypot(dx, dy) < player.r + 26) {
    game.mode = 'levelComplete';
    game.transition = 1.8;
    spawnParticles(game.goal.x, game.goal.y, '#7dffc0', 30, 60, 260);
    beep(660, 0.12, 'sine', 0.06);
    setTimeout(() => beep(880, 0.15, 'sine', 0.06), 110);
    setTimeout(() => beep(1100, 0.2, 'sine', 0.06), 230);
  }
}

function nextLevel() {
  if (game.levelIndex + 1 >= LEVELS.length) {
    game.mode = 'win';
    beep(880, 0.2, 'sine', 0.07);
    setTimeout(() => beep(1100, 0.25, 'sine', 0.07), 160);
    setTimeout(() => beep(1320, 0.35, 'sine', 0.07), 340);
  } else {
    loadLevel(game.levelIndex + 1);
  }
}

/* ============================================================
   الرسم
   ============================================================ */
function render() {
  ctx.save();

  // اهتزاز الشاشة عند الضرر
  if (game.shake > 0) {
    const m = game.shake * 8;
    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }

  drawBackground();

  if (game.mode === 'start') {
    drawStartScreen();
    ctx.restore();
    return;
  }

  drawGoal();
  drawWalls();
  drawCoins();
  drawEnemies();
  drawPlayer();
  drawParticles();
  drawHUD();
  drawOverlays();

  ctx.restore();
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0c1020');
  g.addColorStop(1, '#141a30');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // شبكة خفيفة
  ctx.strokeStyle = 'rgba(90,130,220,0.06)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 40) {
    ctx.moveTo(x + 0.5, 0);
    ctx.lineTo(x + 0.5, H);
  }
  for (let y = 0; y <= H; y += 40) {
    ctx.moveTo(0, y + 0.5);
    ctx.lineTo(W, y + 0.5);
  }
  ctx.stroke();

  // توهج مركزي
  const rg = ctx.createRadialGradient(W / 2, H / 2, 80, W / 2, H / 2, W * 0.7);
  rg.addColorStop(0, 'rgba(60,110,255,0.08)');
  rg.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);
}

function drawWalls() {
  for (const w of game.walls) {
    ctx.save();
    ctx.shadowColor = 'rgba(80,130,255,0.5)';
    ctx.shadowBlur = 14;

    const g = ctx.createLinearGradient(w.x, w.y, w.x, w.y + w.h);
    g.addColorStop(0, '#2b3560');
    g.addColorStop(1, '#1a2140');
    ctx.fillStyle = g;

    ctx.beginPath();
    ctx.roundRect(w.x, w.y, w.w, w.h, 6);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(120,170,255,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(w.x + 1, w.y + 1, w.w - 2, w.h - 2, 5);
    ctx.stroke();

    // لمعة علوية
    ctx.fillStyle = 'rgba(160,200,255,0.12)';
    ctx.beginPath();
    ctx.roundRect(w.x + 3, w.y + 3, w.w - 6, Math.min(5, w.h - 6), 3);
    ctx.fill();

    ctx.restore();
  }
}

function drawGoal() {
  const unlocked = game.collected >= game.totalCoins;
  const t = game.time;
  const pulse = 1 + Math.sin(t * 4) * 0.08;

  ctx.save();
  ctx.translate(game.goal.x, game.goal.y);

  if (unlocked) {
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 46 * pulse);
    g.addColorStop(0, 'rgba(150,255,200,0.95)');
    g.addColorStop(0.45, 'rgba(60,220,150,0.5)');
    g.addColorStop(1, 'rgba(40,180,120,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, 46 * pulse, 0, Math.PI * 2);
    ctx.fill();

    // دوائر دوارة
    ctx.strokeStyle = 'rgba(140,255,200,0.9)';
    ctx.lineWidth = 3;
    for (let i = 0; i < 2; i++) {
      const rr = 20 + i * 9;
      const a0 = t * 2 + i * Math.PI;
      ctx.beginPath();
      ctx.arc(0, 0, rr, a0, a0 + Math.PI * 1.25);
      ctx.stroke();
    }

    ctx.fillStyle = '#eafff5';
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(120,140,200,0.12)';
    ctx.beginPath();
    ctx.arc(0, 0, 30, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(150,175,235,0.45)';
    ctx.lineWidth = 2;
    ctx.setLineDash([7, 7]);
    ctx.lineDashOffset = -t * 20;
    ctx.beginPath();
    ctx.arc(0, 0, 30, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // قفل
    ctx.fillStyle = 'rgba(170,195,255,0.75)';
    ctx.beginPath();
    ctx.roundRect(-9, -3, 18, 15, 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(170,195,255,0.75)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, -3, 7, Math.PI, 0);
    ctx.stroke();
  }

  ctx.restore();
}

function drawCoins() {
  const t = game.time;
  for (const c of game.coins) {
    if (c.taken) continue;
    const bob = Math.sin(t * 3 + c.phase) * 3;
    const scale = 1 + Math.sin(t * 5 + c.phase) * 0.06;

    ctx.save();
    ctx.translate(c.x, c.y + bob);
    ctx.scale(scale, scale);

    ctx.shadowColor = 'rgba(255,200,60,0.9)';
    ctx.shadowBlur = 16;

    const g = ctx.createRadialGradient(-3, -3, 1, 0, 0, c.r + 3);
    g.addColorStop(0, '#fff6c4');
    g.addColorStop(0.55, '#ffd24a');
    g.addColorStop(1, '#d99a10');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, c.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,250,210,0.9)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(0, 0, c.r - 1, 0, Math.PI * 2);
    ctx.stroke();

    // بريق
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(-3.2, -3.5, 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

function drawEnemies() {
  const t = game.time;
  for (const e of game.enemies) {
    const wob = Math.sin(e.phase) * 1.6;

    ctx.save();
    ctx.translate(e.x, e.y + wob);

    // هالة
    const auraR = e.chasing ? 34 : 26;
    const auraColor = e.chasing ? 'rgba(255,70,90,0.35)' : 'rgba(255,70,90,0.18)';
    const ag = ctx.createRadialGradient(0, 0, 0, 0, 0, auraR);
    ag.addColorStop(0, auraColor);
    ag.addColorStop(1, 'rgba(255,70,90,0)');
    ctx.fillStyle = ag;
    ctx.beginPath();
    ctx.arc(0, 0, auraR, 0, Math.PI * 2);
    ctx.fill();

    // الجسم
    const bg = ctx.createRadialGradient(-4, -4, 2, 0, 0, e.r + 2);
    bg.addColorStop(0, '#ff8a9a');
    bg.addColorStop(1, '#a01430');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(0, 0, e.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,180,190,0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // عيون
    const ang = Math.atan2(player.y - e.y, player.x - e.x);
    const ex = Math.cos(ang) * 3.5;
    const ey = Math.sin(ang) * 3.5;

    ctx.fillStyle = '#1a0008';
    ctx.beginPath();
    ctx.arc(-4.5 + ex, -2 + ey, 2.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(4.5 + ex, -2 + ey, 2.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(-5.3 + ex, -2.9 + ey, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(3.7 + ex, -2.9 + ey, 1, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

function drawPlayer() {
  // وميض عند الحماية
  if (game.invuln > 0 && Math.floor(game.invuln * 12) % 2 === 0) return;

  ctx.save();
  ctx.translate(player.x, player.y);

  // هالة
  const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, 38);
  gg.addColorStop(0, 'rgba(90,210,255,0.45)');
  gg.addColorStop(1, 'rgba(90,210,255,0)');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.arc(0, 0, 38, 0, Math.PI * 2);
  ctx.fill();

  // الجسم
  const bg = ctx.createRadialGradient(-5, -6, 2, 0, 0, player.r + 3);
  bg.addColorStop(0, '#c4f0ff');
  bg.addColorStop(0.5, '#59c2ff');
  bg.addColorStop(1, '#1f6fb8');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(0, 0, player.r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(220,248,255,0.95)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // عيون
  const ex = Math.cos(player.facing) * 4.5;
  const ey = Math.sin(player.facing) * 4.5;

  ctx.fillStyle = '#06121f';
  ctx.beginPath();
  ctx.arc(-5 + ex, -2 + ey, 2.7, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(5 + ex, -2 + ey, 2.7, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath();
  ctx.arc(-5.8 + ex, -2.9 + ey, 0.95, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(4.2 + ex, -2.9 + ey, 0.95, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawParticles() {
  for (const p of game.particles) {
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  // شريط علوي شفاف
  ctx.fillStyle = 'rgba(8,12,26,0.72)';
  ctx.beginPath();
  ctx.roundRect(14, 12, W - 28, 52, 14);
  ctx.fill();
  ctx.strokeStyle = 'rgba(90,140,255,0.28)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // القلوب (يمين)
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < game.maxHealth; i++) {
    const x = W - 46 - i * 32;
    const y = 38;
    if (i < game.health) {
      ctx.shadowColor = 'rgba(255,60,100,0.9)';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#ff4d6d';
    } else {
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,77,109,0.18)';
    }
    ctx.font = '28px serif';
    ctx.fillText('♥', x, y);
  }
  ctx.shadowBlur = 0;

  // العملات (يسار)
  const cx = 46, cy = 38;
  const cg = ctx.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, 11);
  cg.addColorStop(0, '#fff6c4');
  cg.addColorStop(1, '#d99a10');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(cx, cy, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,245,190,0.9)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = '#ffe9a8';
  ctx.font = 'bold 20px Tahoma, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`${game.collected} / ${game.totalCoins}`, 66, 39);

  // اسم المرحلة (وسط)
  ctx.fillStyle = 'rgba(190,215,255,0.92)';
  ctx.font = 'bold 17px Tahoma, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(LEVELS[game.levelIndex].name, W / 2, 39);

  // رسالة مؤقتة
  if (game.messageTimer > 0 && game.message) {
    const a = Math.min(1, game.messageTimer * 2);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(10,16,34,0.82)';
    const tw = ctx.measureText(game.message).width;
    ctx.font = 'bold 22px Tahoma, sans-serif';
    const mw = ctx.measureText(game.message).width + 60;
    ctx.beginPath();
    ctx.roundRect(W / 2 - mw / 2, 80, mw, 48, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(110,170,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = '#cfe4ff';
    ctx.textAlign = 'center';
    ctx.fillText(game.message, W / 2, 106);
    ctx.globalAlpha = 1;
  }

  ctx.textBaseline = 'alphabetic';
}

function drawOverlays() {
  if (game.mode === 'levelComplete') {
    dimScreen(0.55);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8effc0';
    ctx.font = 'bold 46px Tahoma, sans-serif';
    ctx.shadowColor = 'rgba(120,255,190,0.8)';
    ctx.shadowBlur = 24;
    ctx.fillText('أحسنت!', W / 2, H / 2 - 12);
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(200,230,255,0.85)';
    ctx.font = '20px Tahoma, sans-serif';
    const isLast = game.levelIndex + 1 >= LEVELS.length;
    ctx.fillText(isLast ? 'أنهيت جميع المراحل!' : 'جارٍ الانتقال للمرحلة التالية...', W / 2, H / 2 + 42);

    ctx.fillStyle = 'rgba(150,180,230,0.6)';
    ctx.font = '16px Tahoma, sans-serif';
    ctx.fillText('اضغط مسافة للتخطي', W / 2, H / 2 + 82);
  }

  if (game.mode === 'gameOver') {
    dimScreen(0.72);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff4d6d';
    ctx.font = 'bold 54px Tahoma, sans-serif';
    ctx.shadowColor = 'rgba(255,70,110,0.8)';
    ctx.shadowBlur = 26;
    ctx.fillText('انتهت اللعبة', W / 2, H / 2 - 24);
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(210,225,255,0.9)';
    ctx.font = '21px Tahoma, sans-serif';
    ctx.fillText(`وصلت إلى: ${LEVELS[game.levelIndex].name}`, W / 2, H / 2 + 26);

    ctx.fillStyle = '#a9c8ff';
    ctx.font = 'bold 19px Tahoma, sans-serif';
    ctx.fillText('اضغط مسافة لإعادة المحاولة', W / 2, H / 2 + 74);
  }

  if (game.mode === 'win') {
    dimScreen(0.78);
    ctx.textAlign = 'center';

    const t = game.time;
    const pulse = 1 + Math.sin(t * 3) * 0.03;
    ctx.save();
    ctx.translate(W / 2, H / 2 - 40);
    ctx.scale(pulse, pulse);

    ctx.fillStyle = '#ffd24a';
    ctx.font = 'bold 52px Tahoma, sans-serif';
    ctx.shadowColor = 'rgba(255,210,80,0.9)';
    ctx.shadowBlur = 30;
    ctx.fillText('🏆 فوز عظيم!', 0, 0);
    ctx.restore();
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(215,230,255,0.95)';
    ctx.font = '23px Tahoma, sans-serif';
    ctx.fillText('لقد أنقذت المملكة وأكملت كل المراحل!', W / 2, H / 2 + 30);

    ctx.fillStyle = '#a9c8ff';
    ctx.font = 'bold 19px Tahoma, sans-serif';
    ctx.fillText('اضغط مسافة للعب من جديد', W / 2, H / 2 + 82);
  }
}

function dimScreen(alpha) {
  ctx.fillStyle = `rgba(4,7,16,${alpha})`;
  ctx.fillRect(0, 0, W, H);
}

function drawStartScreen() {
  const t = game.time;

  // عنوان
  ctx.textAlign = 'center';

  const pulse = 1 + Math.sin(t * 2) * 0.02;
  ctx.save();
  ctx.translate(W / 2, 170);
  ctx.scale(pulse, pulse);

  ctx.fillStyle = '#7ec8ff';
  ctx.font = 'bold 62px Tahoma, sans-serif';
  ctx.shadowColor = 'rgba(90,180,255,0.9)';
  ctx.shadowBlur = 34;
  ctx.fillText('مغامرة البطل', 0, 0);
  ctx.restore();
  ctx.shadowBlur = 0;

  // بطل متحرك
  const px = W / 2 + Math.sin(t * 1.4) * 130;
  const py = 300 + Math.cos(t * 2.2) * 16;
  ctx.save();
  ctx.translate(px, py);
  const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, 44);
  gg.addColorStop(0, 'rgba(90,210,255,0.5)');
  gg.addColorStop(1, 'rgba(90,210,255,0)');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.arc(0, 0, 44, 0, Math.PI * 2);
  ctx.fill();

  const bg = ctx.createRadialGradient(-6, -7, 2, 0, 0, 22);
  bg.addColorStop(0, '#c4f0ff');
  bg.addColorStop(0.5, '#59c2ff');
  bg.addColorStop(1, '#1f6fb8');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(0, 0, 20, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(220,248,255,0.95)';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.fillStyle = '#06121f';
  ctx.beginPath();
  ctx.arc(-6, -3, 3.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(6, -3, 3.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // تعليمات
  ctx.fillStyle = 'rgba(200,222,255,0.92)';
  ctx.font = '21px Tahoma, sans-serif';
  ctx.fillText('استخدم الأسهم أو WASD للتحرك', W / 2, 400);
  ctx.fillText('اجمع كل العملات الذهبية ثم اهرب عبر البوابة الخضراء', W / 2, 436);
  ctx.fillText('تجنب الأعداء الحمراء — لديك ٣ قلوب فقط', W / 2, 472);

  // زر البدء
  const blink = 0.55 + Math.sin(t * 4) * 0.45;
  ctx.globalAlpha = blink;
  ctx.fillStyle = '#8effc0';
  ctx.font = 'bold 27px Tahoma, sans-serif';
  ctx.shadowColor = 'rgba(120,255,190,0.9)';
  ctx.shadowBlur = 22;
  ctx.fillText('اضغط مسافة للبدء', W / 2, 545);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

/* ============================================================
   حلقة اللعبة
   ============================================================ */
let lastTime = performance.now();

function loop(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;   // حماية من القفزات
  if (dt < 0) dt = 0;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

/* ============================================================
   التشغيل
   ============================================================ */
loadLevel(0);
game.mode = 'start';
requestAnimationFrame(loop);

})();
</script>
