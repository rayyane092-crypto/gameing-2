<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أرشيف الألعاب - تصميم داكن</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0f17;
      color: #f3f4f6;
      padding: 20px;
    }

    /* الشريط العلوي */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #111827;
      padding: 14px 24px;
      border-radius: 12px;
      border: 1px solid #1f2937;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: #d1d5db;
      text-decoration: none;
      font-weight: 600;
    }

    .nav-links a.active,
    .nav-links a:hover {
      color: #3b82f6;
    }

    .search-input {
      background-color: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      padding: 10px 16px;
      border-radius: 25px;
      width: 280px;
      outline: none;
    }

    .search-input:focus {
      border-color: #3b82f6;
    }

    .btn-login {
      background-color: #2563eb;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    /* شريط الفلاتر */
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-select {
      background-color: #161e2e;
      color: #e5e7eb;
      border: 1px solid #2d3748;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* شبكة بطاقات الألعاب */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 18px;
    }

    .game-card {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background-color: #161e2e;
      border: 1px solid #243044;
      transition: transform 0.25s ease, border-color 0.25s ease;
      cursor: pointer;
    }

    .game-card:hover {
      transform: translateY(-5px);
      border-color: #3b82f6;
    }

    .game-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .size-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: rgba(15, 23, 42, 0.88);
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.4);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }

    .game-title {
      padding: 20px;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

  <header class="navbar" >
    <button class="btn-login">تسجيل الدخول</button>
    <input type="text" class="search-input" placeholder="ابحث عن لعبة، تصنيف..." dir="rtl">
    <nav dir="rtl" class="nav-links">
      <a href="#" class="active">الألعاب</a>
      <a href="#">الرئيسية</a>
      <a href="#">التصنيفات</a>
    </nav>
  </header>

  <div class="filters" dir="rtl">
    <select class="filter-select">
      <option>التصنيف</option>
      <option>رعب</option>
      <option>مغامرات</option>
      <option>أكشن</option>
    </select>
    <select class="filter-select">
      <option>التقييم</option>
    </select>
  </div>

  <section class="games-grid" dir="rtl">
    <div class="game-card" data-category="مغامرات">
      <a href="gdhsl.html"><img src="28670746-58ec-4579-a9a3-69220632610f.webp" alt="Game 1"></a>
      <div class="game-title">باركور هارد — 5000 مرحل</div>
    </div>

    <div class="game-card" data-category="أكشن">
      <a href="fhgdhf.html"><img src="watermarked_img_13984540788335650458.webp" alt="Game 2"></a>
      <div class="game-title">Super Mario</div>
    </div>

    <div class="game-card" data-category="رعب">
      <a href="granny.html"><img src="6cd6a10e-1e6b-48d0-a5d3-9b89074636b1.webp" alt="Game 3"></a>
      <div class="game-title">Granny</div>
    </div>

     <div class="game-card" data-category="مغامرات">
     <a href="exe3.html" ><img src="e89eae0f-b6e9-4e9e-b2c5-34e95f8b9a8d.webp" alt="Game 4"></a>
      <div class="game-title">Subway Runner</div>
    </div>

     <div class="game-card" data-category="أكشن">
      <a href="exe2.html"><img src="watermarked_img_7380126535292205989.webp" alt="Game 5"></a>
      <div class="game-title">Space Blaster — سبيس بلاستر</div>
    </div>

     <div class="game-card" data-category="أكشن">
      <a href="exe1.html"><img src="watermarked_img_680708359276520799.webp" alt="Game 6"></a>
      <div class="game-title"> Neon Breaker</div>
    </div>

     <div class="game-card" data-category="مغامرات">
      <a href="ghgdh.html"><img src="a513bd2f-0730-4200-aae6-7922a001f845.webp" alt="Game 7"></a>
      <div class="game-title">مغامرة البطل</div>
    </div>

  </section>
<script>
  const searchInput = document.querySelector('.search-input');
  const categorySelect = document.querySelector('.filters select');
  const sortSelect = document.getElementById('sortSelect');
  const grid = document.querySelector('.games-grid');
  const cards = Array.from(document.querySelectorAll('.game-card'));
  const resultsCount = document.getElementById('resultsCount');

  // عناصر النافذة المنبثقة
  const modal = document.getElementById('gameModal');
  const closeModal = document.getElementById('closeModal');
  const modalImg = document.getElementById('modalImg');
  const modalTitle = document.getElementById('modalTitle');
  const modalMeta = document.getElementById('modalMeta');

  function updateView() {
    const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
    const selectedCategory = categorySelect ? categorySelect.value : '';

    let visibleCount = 0;

    cards.forEach(card => {
      const title = card.querySelector('.game-title').textContent.trim().toLowerCase();
      const category = (card.dataset.category || '').trim();

      const matchesSearch = !query || title.includes(query);
      const matchesCategory =
        !selectedCategory ||
        selectedCategory === 'التصنيف' ||
        category === selectedCategory;

      const show = matchesSearch && matchesCategory;
      card.style.display = show ? '' : 'none';
      if (show) visibleCount++;
    });

    if (resultsCount) {
      resultsCount.textContent = `(${visibleCount})`;
    }
  }

  // الفرز حسب الاسم
  if (sortSelect && grid) {
    sortSelect.addEventListener('change', () => {
      const sorted = [...cards].sort((a, b) => {
        const nameA = a.querySelector('.game-title').textContent.trim();
        const nameB = b.querySelector('.game-title').textContent.trim();
        if (sortSelect.value === 'name-asc') return nameA.localeCompare(nameB, 'ar');
        if (sortSelect.value === 'name-desc') return nameB.localeCompare(nameA, 'ar');
        return 0;
      });
      sorted.forEach(card => grid.appendChild(card));
      updateView();
    });
  }

  // فتح نافذة تفاصيل اللعبة عند النقر على البطاقة
  cards.forEach(card => {
    card.addEventListener('click', () => {
      const img = card.querySelector('img');
      const title = card.querySelector('.game-title').textContent.trim();
      const size = card.querySelector('.size-badge')?.textContent.trim() || '';
      const cat = card.dataset.category || 'عام';

      modalImg.src = img ? img.src : '';
      modalImg.alt = title;
      modalTitle.textContent = title;
      modalMeta.textContent = `التصنيف: ${cat} | الحجم: ${size}`;
      modal.style.display = 'flex';
    });
  });

  if (closeModal) {
    closeModal.addEventListener('click', () => {
      modal.style.display = 'none';
    });
  }

  window.addEventListener('click', (e) => {
    if (e.target === modal) modal.style.display = 'none';
  });

  if (searchInput) searchInput.addEventListener('input', updateView);
  if (categorySelect) categorySelect.addEventListener('change', updateView);

  updateView();
</script>

</body>
</html>
